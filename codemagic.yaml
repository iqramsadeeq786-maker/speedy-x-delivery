
workflows:
  rider-android:
    name: Speedy X Rider Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project files
        script: |
          cd rider-app
          flutter create --platforms=android --project-name speedy_x_rider .

            - name: Add Firebase configuration
        script: |
          cd rider-app
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i "/^plugins {/a\\    id 'com.google.gms.google-services' version '4.4.2' apply false" android/settings.gradle
            sed -i "/^plugins {/a\\    id 'com.google.gms.google-services'" android/app/build.gradle
          else
            echo "Gradle files not found"
            exit 1
          fi

      - name: Get Flutter packages
        script: |
          cd rider-app
          flutter pub get

      - name: Build Rider APK
        script: |
          cd rider-app
          flutter build apk --debug

    artifacts:
      - rider-app/build/app/outputs/flutter-apk/*.apk
      
