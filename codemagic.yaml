
workflows:
  rider-android:
    name: Speedy X Rider Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project files
        script: |
          cd rider-app
          flutter create --platforms=android --project-name speedy_x_rider .

      - name: Add Firebase configuration
        script: |
          cd rider-app
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("android")
          settings = next((android / n for n in ["settings.gradle.kts", "settings.gradle"] if (android / n).exists()), None)
          app = next((android / "app" / n for n in ["build.gradle.kts", "build.gradle"] if (android / "app" / n).exists()), None)

          if not settings or not app:
              raise SystemExit("Android Gradle files not found")

          settings_plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false' if settings.suffix == ".kts" else "    id 'com.google.gms.google-services' version '4.4.2' apply false"
          app_plugin = '    id("com.google.gms.google-services")' if app.suffix == ".kts" else "    id 'com.google.gms.google-services'"

          for file, plugin in [(settings, settings_plugin), (app, app_plugin)]:
              content = file.read_text()
              if "com.google.gms.google-services" not in content:
                  content = re.sub(r"plugins\s*\{", lambda m: m.group(0) + "\n" + plugin, content, count=1)
                  file.write_text(content)

          print("Firebase Gradle plugin configured")
          PY

      - name: Get Flutter packages
        script: |
          cd rider-app
          flutter pub get

      - name: Build Rider APK
        script: |
          cd rider-app
          flutter build apk --debug

    artifacts:
      - rider-app/build/app/outputs/flutter-apk/*.apk
      
